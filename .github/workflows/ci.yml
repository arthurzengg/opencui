name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same PR/branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install deps (root)
        run: bun install --frozen-lockfile

      - name: Type-check (host)
        run: bun run check-types

      - name: Build (host esbuild + webview vite)
        run: bun run compile

      - name: Tests (unit + component + mock-opencode E2E)
        run: bun run test

      # Integration tests boot a real VS Code via @vscode/test-electron.
      # On Linux runners we need xvfb-run to provide a virtual display;
      # macOS/Windows runners would not need this wrapper.
      - name: Cache VS Code test binary
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-

      - name: Integration tests (@vscode/test-electron)
        run: xvfb-run --auto-servernum bun run test:integration
