name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install deps (root)
        run: bun install --frozen-lockfile

      - name: Install deps (webview)
        run: bun install --frozen-lockfile
        working-directory: webview

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME (=$TAG) does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Type-check
        run: bun run check-types

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run package

      - name: Package .vsix
        run: bunx @vscode/vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        run: bunx @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: bunx ovsx publish *.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
